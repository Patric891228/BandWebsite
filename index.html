<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>樂團歌單</title>
  <link rel="preconnect" href="https://script.google.com" />
  <link rel="preconnect" href="https://img.youtube.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand-mark" href="./" aria-label="樂團演出歌單首頁"><span class="brand-icon">♫</span><span>樂團歌單</span></a>
  </header>

  <main class="site-main">
    <section class="search-section" aria-label="演出搜尋">
      <div class="search-toolbar">
        <div class="hero-search-icon" aria-hidden="true">⌕</div>
        <div class="hero-search-field">
          <label class="sr-only" for="eventSearch">搜尋演出、歌曲或歌手</label>
          <input id="eventSearch" type="search" autocomplete="off" />
        </div>
        <div class="hero-search-divider"></div>
        <div class="sort-control">
          <span class="sort-icon" aria-hidden="true">↕</span>
          <label class="sr-only" for="eventSort">排序</label>
          <select id="eventSort">
            <option value="date-desc">日期由新到舊</option>
            <option value="date-asc">日期由舊到新</option>
            <option value="title-asc">演出名稱</option>
          </select>
        </div>
        <button class="search-submit" type="button" aria-label="搜尋" onclick="document.getElementById('eventSearch').focus()">⌕</button>
      </div>
    </section>

    <div class="content-shell">
    <div id="eventPage">
      <div id="eventTools" class="event-tools" hidden></div>
      <div class="section-heading" id="events">
        <p id="eventCount" class="status-copy" aria-live="polite"></p>
      </div>
      <div id="eventList" class="event-grid"></div>
      <div id="eventEmpty" class="empty-state" hidden></div>
      <section id="globalSongResults" class="global-song-results" hidden aria-label="全站歌曲搜尋結果">
        <h2 id="globalSongHeading" class="global-song-heading"></h2>
        <div class="song-table-shell overflow-x-auto rounded-[24px]">
          <table class="song-table mx-auto min-w-full bg-white text-lg">
            <thead>
              <tr>
                <th class="px-4 py-4 text-center text-xl">歌曲</th>
                <th class="px-4 py-4 text-center text-xl">演出場次</th>
                <th class="px-4 py-4 text-center text-xl sm:text-left">YouTube</th>
              </tr>
            </thead>
            <tbody id="globalSongList" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="songPage" class="hidden fade-in-up">
      <button id="backButton" type="button" class="back-button mb-6 mx-auto transition-transform duration-300 hover:scale-105">
        返回演出列表
      </button>
      <h1 id="subtitle" class="event-title"></h1>
      <div id="eventDetails" class="event-details" hidden></div>
      <label class="sr-only" for="songSearch">搜尋歌曲</label>
      <input id="songSearch" class="song-search" type="search" placeholder="搜尋歌曲或歌手" autocomplete="off" />
      <p id="songCount" class="status-copy" aria-live="polite"></p>
      <div id="songEmpty" class="empty-state" hidden></div>

      <div class="song-table-shell overflow-x-auto rounded-[24px]">
        <table class="song-table mx-auto min-w-full bg-white text-lg">
          <thead>
            <tr>
              <th class="px-4 py-4 text-center text-xl">歌曲</th>
              <th class="px-4 py-4 text-center text-xl sm:text-left">YouTube</th>
            </tr>
          </thead>
          <tbody id="songList" class="fade-in-up-delayed divide-y divide-gray-200">
          </tbody>
        </table>
      </div>
    </div>
    </div>

    <div id="loading" class="loading-copy mt-6 text-center text-base" role="status" aria-live="polite">
      <canvas id="loadingAnimation" class="loading-animation" width="539" height="208" aria-hidden="true"></canvas>
      <span id="loadingMessage" hidden></span>
    </div>
    <button id="retryButton" class="back-button retry-button" type="button" hidden>重新載入</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
